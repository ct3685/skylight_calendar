name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Lint and tests (Python 3.14, Home Assistant 2026.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Syntax check
        run: python -m compileall -q custom_components tests
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

  core-smoke:
    name: Real Home Assistant 2026.11.1 core smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Home Assistant 2026.11.1
        # The frontend keeps HA out of recovery mode, which disables custom integrations.
        run: pip install homeassistant==2026.11.1 home-assistant-frontend==20261028.5 pytest
      - name: Smoke test
        run: python scripts/ha_core_smoke.py

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Repo-settings checks for the default HACS store; this is a custom repository.
          ignore: brands topics issues
